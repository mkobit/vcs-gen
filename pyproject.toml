[project]
name = "vcs-gen"
version = "0.1.0"
description = "A zero-dependency toolkit to compose configuration files for Git, JJ, and other VCS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mkobit" }]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
vcs-gen = "vcs_gen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src/vcs_gen",
    "/README.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vcs_gen"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.6",
    "ty==0.0.78",
    "python-semantic-release==10.6.2",
]

[tool.uv]
managed = true
package = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "S",
    "C4",
    "PTH",
    "RUF",
    "SIM",
    "PL",
    "TRY",
    "DTZ",
    "PERF",
    "FLY",
    "PIE",
    "FA",
    "ASYNC",
    "LOG",
    "G",
    "T20",
    "RET",
    "SLF",
    "SLOT",
    "TID",
    "TCH",
    "ARG",
    "PGH",
    "FURB",
    "PYI",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-report=xml -m 'not remote'"
markers = [
    "remote: tests that require network access to fetch templates",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    'if __name__ == "__main__":',
    "def __repr__",
    "raise NotImplementedError",
    "pass",
]

[tool.semantic_release]
version_variable = ["src/vcs_gen/__init__.py:__version__"]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
upload_to_pypi = true
upload_to_release = true
build_command = "uv build"
